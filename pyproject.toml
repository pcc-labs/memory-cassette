[project]
name = "memory-cassette"
version = "0.1.0"
description = "Derived agent memory over tapes sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121.2",
    "pydantic>=2.13.1",
    "uvicorn[standard]>=0.42.0",
]

# Cognee is the real backend, and an extra rather than a dependency. It pulls a
# large tree (an LLM stack, a vector store, an embedded graph database) that the
# volatile fallback needs none of, so `make test` and a local look around stay
# fast while the image (Dockerfile) installs `.[cognee]` and gets the engine.
[project.optional-dependencies]
# The fastembed extra is not optional in practice: EMBEDDING_PROVIDER defaults
# to fastembed (compose.yaml) so that a deployment needs one vendor credential
# rather than two, and without this the engine fails on the first write with an
# ImportError buried inside a migration failure.
cognee = ["cognee[fastembed]>=1.5.3"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

# Flat app layout (main.py, store.py, manifest.py) -- nothing to build or install.
[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20"]
ignore = [
    "E501",  # Long lines: SQL statements in store.py read better unwrapped
    "N815",  # mixedCase fields: pydantic models mirror the camelCase JSON wire format
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = [
    "F841",  # Unused variables in tests (fixtures, etc.)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = """
    -q
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-fail-under=73
"""
testpaths = ["."]
# The store is async because Cognee's API is. `auto` keeps that out of every
# test signature.
asyncio_mode = "auto"

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "test_*.py",
    "deploy/*",
    # Exercised only against a live Cognee instance (`make test-cognee`), which
    # needs the extra installed and an LLM credential. Counting it in the
    # default run would report coverage the default run cannot earn.
    "cognee_store.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true
