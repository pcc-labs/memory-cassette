# What runs on the box. Same three services as the local compose, with two
# differences: nothing is built here (both images are pulled), and Postgres
# holds a real password instead of the local throwaway.
#
# Tapes runs here too, not just the cassette. A cassette is only reachable
# through a core, so hosting the cassette alone would still require a tapes
# running somewhere else — and paperplane's memory base points at a tapes, not
# at a cassette.
name: memory-cassette

services:
  postgres:
    image: public.ecr.aws/g4e5l3z3/papercomputeco/postgres:17.7-pgduckdb-1.1.1
    restart: unless-stopped
    environment:
      POSTGRES_DB: tapes
      POSTGRES_USER: tapes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./provision.sql:/docker-entrypoint-initdb.d/10-cassette-role.sql:ro
    healthcheck:
      # -h forces TCP. During initdb Postgres runs a temporary server on the
      # unix socket only, so a bare pg_isready reports healthy seconds before
      # anything can connect over the network.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tapes -d tapes"]
      interval: 1s
      timeout: 3s
      retries: 30

  memory:
    image: ${MEMORY_IMAGE}
    restart: unless-stopped
    environment:
      CASSETTE_NAME: memory
      TAPES_DATABASE_URL: postgres://cassette_memory:${CASSETTE_PASSWORD}@postgres:5432/tapes?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    # No ports. The cassette is reachable only from inside this compose
    # network; the security group protects tapes, and nothing should be able to
    # reach the cassette around it.

  tapes:
    image: public.ecr.aws/g4e5l3z3/papercomputeco/tapes:v0.34.0
    restart: unless-stopped
    command: >-
      serve api
      --listen 0.0.0.0:8082
      --postgres postgres://tapes:${POSTGRES_PASSWORD}@postgres:5432/tapes?sslmode=disable
      --cassettes http://memory:9998/openapi
      --cassette-refresh 30s
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
