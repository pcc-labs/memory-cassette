# What runs on the box. Same three services as the local compose, with three
# differences: nothing is built here (both images are pulled), Postgres holds a
# real password instead of the local throwaway, and the LLM credential comes
# from the instance's .env rather than the operator's shell.
#
# Tapes runs here too, not just the cassette. A cassette is only reachable
# through a core, so hosting the cassette alone would still require a tapes
# running somewhere else — and a client's memory base points at a tapes, not
# at a cassette.
name: memory-cassette

services:
  postgres:
    image: public.ecr.aws/g4e5l3z3/papercomputeco/postgres:17.7-pgduckdb-1.1.1
    restart: unless-stopped
    environment:
      POSTGRES_DB: tapes
      POSTGRES_USER: tapes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./provision.sql:/docker-entrypoint-initdb.d/10-cassette-role.sql:ro
    healthcheck:
      # -h forces TCP. During initdb Postgres runs a temporary server on the
      # unix socket only, so a bare pg_isready reports healthy seconds before
      # anything can connect over the network.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tapes -d tapes"]
      interval: 1s
      timeout: 3s
      retries: 30

  memory:
    image: ${MEMORY_IMAGE}
    restart: unless-stopped
    volumes:
      # Cognee's databases and ingested files. This volume is the memory: the
      # box can be rolled onto a new image (deploy/push.sh) without it moving.
      - cognee-data:/var/lib/cognee
    environment:
      CASSETTE_NAME: memory
      COGNEE_ENABLED: "true"

      # Supplied by deploy/aws.sh from the operator's own environment and
      # written to the instance's .env. The only secret here that AWS did not
      # generate, and the only one worth rotating by hand.
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}

      # Local embeddings, so the box needs one vendor rather than two.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}

      DB_PROVIDER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: memory
      DB_USERNAME: cassette_memory
      DB_PASSWORD: ${CASSETTE_PASSWORD}
      VECTOR_DB_PROVIDER: pgvector
      COGNEE_STORAGE_DIR: /var/lib/cognee
    depends_on:
      postgres:
        condition: service_healthy
    # No ports. The cassette is reachable only from inside this compose
    # network; the security group protects tapes, and nothing should be able to
    # reach the cassette around it. That matters more now: this process holds
    # an LLM credential and the whole knowledge graph.

  tapes:
    image: public.ecr.aws/g4e5l3z3/papercomputeco/tapes:v0.34.0
    restart: unless-stopped
    command: >-
      serve api
      --listen 0.0.0.0:8082
      --postgres postgres://tapes:${POSTGRES_PASSWORD}@postgres:5432/tapes?sslmode=disable
      --cassettes http://memory:9998/openapi
      --cassette-refresh 30s
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  cognee-data:
