# The memory cassette's publishable manifest.
#
# This is the authored form of the metadata served at /openapi under the
# `x-tapes-cassette` extension. A registry or orchestrator reads this file
# before anything is running; tapes core reads none of it. The copy that
# matters for admission is the one in manifest.py, and the two must agree.
#
# The dependency points one way. This declares `depends.core = "v1"`, a
# contract major rather than a tapes release, and a core decides for itself
# whether it serves that contract.

kind = "cassette/v1alpha1"

# No tables. The store is Cognee, which keeps its own relational tables in its
# own database, so this cassette owns nothing in the tapes database and takes no
# grant on it. See provision.sql for the database and role a deployment creates
# instead, and cognee_store.py for what the cassette does with them.
#
# Declared by its absence: empty rather than omitted, so "this cassette stores
# nothing in tapes" is a stated fact rather than a gap. It sits up here with the
# other top-level keys because a bare key after a [section] header would belong
# to that section instead.
tables = []

# `name` is the identity everything derives from: the route
# (/v1/cassettes/memory), the Cognee database ("memory"), and the role
# ("cassette_memory").
[cassette]
name = "memory"
version = "0.0.1"
display_name = "Memory"
description = "Derived agent memory. Ingests client reflections and dreams; recall is exposed to agents over MCP."
license = "MIT"
homepage = "https://github.com/papercomputeco/tapes"
image = "papercompute/memory-cassette:0.0.1"
port = 9998

# Contract views this cassette reads, and none yet: the admission spike proves
# the contract works out-of-Go before taking a grant on tapes data. Step 2 adds
# ["sessions", "spans"], which become SELECT on tapes_v1.<view>.
#
# `raw_turns` may never be listed here. Core refuses the manifest outright if
# it is, which is the boundary that keeps memory derived from the read model.
[depends]
core = "v1"
views = []

# Where core finds things on this cassette's own listener. `prefix_path` is the
# load-bearing one: this process serves under /api/memory, core republishes at
# /v1/cassettes/memory, and declaring it makes that swap a stated fact.
[api]
health = "/ping"
openapi = "/openapi"
prefix_path = "api"

[[config]]
key = "cognee_storage_dir"
type = "string"
default = "/var/lib/cognee"
description = "Where the embedded Cognee engine keeps its graph and ingested files. Must be a volume: on the container filesystem every memory is lost on redeploy."

[[config]]
key = "llm_provider"
type = "string"
default = "openai"
description = "LLM provider Cognee builds the knowledge graph with, called when an entry is accepted. Embeddings run locally and need no second credential."

[[config]]
key = "review_required"
type = "bool"
default = true
description = "Withhold entries from recall until a human accepts them. Enforced structurally: only accepted entries are ever cognified, so unreviewed prose is not in the graph."
